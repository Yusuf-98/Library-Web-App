<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Early data -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <script>
      (function () {
        var api = '%VITE_API_URL%';
        if (location.pathname !== '/' || api.indexOf('http') !== 0 || !window.fetch) return;
        var request = fetch(api + '/books?limit=10&page=1').then(function (response) {
          return response.json();
        });
        request.catch(function () {});
        window.__earlyBooks = request;
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Booky is a library web app: browse books by category or author, add them to a cart, borrow for 3, 5 or 10 days, and track your loans and reviews."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Booky" />
    <meta property="og:title" content="Booky — Library Web App" />
    <meta
      property="og:description"
      content="Browse books by category or author, add them to a cart, borrow for 3, 5 or 10 days, and track your loans and reviews."
    />
    <meta property="og:url" content="https://library-web-by-yusuf.vercel.app/" />
    <meta property="og:image" content="https://library-web-by-yusuf.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Welcome to Booky home page banner" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Booky — Library Web App" />
    <meta
      name="twitter:description"
      content="Browse books by category or author, add them to a cart, borrow for 3, 5 or 10 days, and track your loans and reviews."
    />
    <meta name="twitter:image" content="https://library-web-by-yusuf.vercel.app/og-image.png" />
    <title>Booky — Library Web App</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Booky",
        "url": "https://library-web-by-yusuf.vercel.app/",
        "description": "A library web app for browsing books, borrowing them with a chosen duration, and tracking loans and reviews.",
        "applicationCategory": "ReferenceApplication",
        "author": {
          "@type": "Person",
          "name": "Yusuf AR",
          "url": "https://github.com/Yusuf-98"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- App shell -->
      <div aria-hidden="true" class="min-h-screen bg-neutral-50 flex flex-col">
        <div class="w-full h-16 md:h-[clamp(64px,calc(45.71px+2.381vw),80px)] mb-5 bg-white shadow-navbar flex items-center">
          <div class="custom-container w-full flex items-center gap-1 md:gap-3.75">
            <img src="/src/assets/images/logo-booky.png" alt="" class="size-10 md:size-[clamp(40px,calc(37.71px+0.298vw),42px)] object-contain" />
            <span class="hidden md:inline text-display-md font-extrabold text-neutral-950">Booky</span>
          </div>
        </div>
        <!-- Hero -->
        <main id="shell-hero" class="flex-1 custom-container flex flex-col pt-xl md:pt-[clamp(16px,calc(-20.57px+4.762vw),48px)] gap-xl md:gap-[clamp(16px,calc(-20.57px+4.762vw),48px)]">
          <section>
            <div>
              <img
                src="/src/assets/images/hero-banner-home-1200.webp"
                srcset="/src/assets/images/hero-banner-home-640.webp 640w, /src/assets/images/hero-banner-home-800.webp 800w, /src/assets/images/hero-banner-home-1200.webp 1200w"
                sizes="(min-width: 1280px) 1200px, calc(100vw - 32px)"
                width="1200"
                height="441"
                fetchpriority="high"
                alt="Welcome to Booky"
                class="w-full aspect-1200/441 object-cover rounded-4xl"
              />
            </div>
          </section>
        </main>
        <script>
          if (location.pathname !== '/') document.getElementById('shell-hero').remove();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
